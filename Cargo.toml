[package]
name = "toksqueeze"
version = "0.1.0"
edition = "2021"
description = "Zero-latency local token & context compression proxy for LLM APIs"
license = "MIT"

[[bin]]
name = "toksqueeze"
path = "src/main.rs"

[lib]
name = "toksqueeze"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
regex = "1.13"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiktoken-rs = "0.12"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
