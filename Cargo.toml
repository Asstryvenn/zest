[package]
name = "zest"
version = "0.1.0"
edition = "2021"
description = "Zero-latency local token & context compression proxy for LLM APIs"
license = "MIT"

[[bin]]
name = "zest"
path = "src/main.rs"

[lib]
name = "zest"
path = "src/lib.rs"

[dependencies]
axum = "0.8"
bytes = "1"
clap = { version = "4.6", features = ["derive", "env"] }
futures-util = "0.3"
http = "1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "aws_lc_rs"] }
regex = "1.13"
reqwest = { version = "0.13", features = ["stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
aws-lc-rs = "1"
tiktoken-rs = "0.12"
time = "0.3"
toml = "1.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "process"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-typescript = "0.23"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
